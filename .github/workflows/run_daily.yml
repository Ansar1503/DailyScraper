name: Daily Offer Scraper

on:  
  schedule:    
    # Testing trigger for 3:05 PM IST (9:35 AM UTC)
    - cron: '35 9 * * *'  
  workflow_dispatch: 

jobs:  
  run-scraper:    
    runs-on: ubuntu-latest    
    permissions:      
      contents: write    
    steps:    
      - name: Checkout repository code      
        uses: actions/checkout@v4    

      - name: Set up Python Environment      
        uses: actions/setup-python@v5      
        with:        
          python-version: '3.10'    

      - name: Install Libraries      
        run: |        
          python -m pip install --upgrade pip        
          pip install -r requirement.txt    

      - name: Run Scraper Script      
        run: python scraper.py    

      - name: Commit and Save the Excel Report back to GitHub      
        run: |        
          git config --global user.name "GitHub Action Scraper"        
          git config --global user.email "actions@github.com"        
          git add daily_offers.xlsx        
          git commit -m "Automated Report Update: $(date +'%Y-%m-%d')" || exit 0        
          git push origin HEAD:${{ github.ref_name }}